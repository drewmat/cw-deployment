apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: {{ required "nodeRoleName is required" .Values.nodeRoleName | quote }}
  amiSelectorTerms:
    - alias: al2023@latest
  # Both are discovered through the karpenter.sh/discovery tag set by Terraform.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpTokens: required          # IMDSv2 only
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        encrypted: true

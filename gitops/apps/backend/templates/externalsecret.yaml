apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  annotations:
    # The CRDs and ClusterSecretStore come from earlier sync waves.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secret.storeName }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  # The RDS-managed secret is JSON: {"username": "...", "password": "..."}.
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "secret.remoteKey is required" .Values.secret.remoteKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.secret.remoteKey | quote }}
        property: password

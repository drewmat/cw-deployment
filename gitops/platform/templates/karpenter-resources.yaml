apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/charts/karpenter-resources
    helm:
      valuesObject:
        clusterName: {{ .Values.cluster.name | quote }}
        nodeRoleName: {{ required "karpenter.nodeRoleName is required" .Values.karpenter.nodeRoleName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

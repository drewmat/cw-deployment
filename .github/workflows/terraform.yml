name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Terraform input variables come from non-secret repository variables.
  TF_VAR_project: ${{ vars.PROJECT_NAME }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}
  TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_git_revision: ${{ github.event.repository.default_branch }}

jobs:
  validate:
    name: fmt / validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform/bootstrap, terraform/envs/prod, terraform/envs/prod-platform]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

      # No backend and no AWS credentials needed for static validation.
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  plan:
    name: plan (PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # request the GitHub OIDC token
      pull-requests: write # post the plan as a PR comment
    concurrency:
      group: terraform-plan-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Read-only role: trusted only for pull_request events from this repo.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-gha-tf-plan
          role-session-name: tf-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            // PR comments are capped at 65,536 chars; keep the tail (summary lines).
            const max = 60000;
            if (plan.length > max) plan = '... (truncated)\n' + plan.slice(-max);
            const status = process.env.PLAN_OUTCOME === 'success' ? 'succeeded' : 'FAILED';
            const body = `${marker}\n### Terraform plan ${status}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: apply (main)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    # The "prod" GitHub Environment holds the approval gate (required reviewers,
    # main-only deployment branches). The apply role trusts exactly this
    # environment's OIDC subject: repo:<org>/<repo>:environment:prod
    environment: prod
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply
      cancel-in-progress: false # never interrupt an apply mid-flight
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # TEMPORARY DEBUG: prints the (non-secret) claims of the OIDC token so they
      # can be compared with the role's trust policy. Remove once resolved.
      - name: DEBUG show OIDC claims
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          keys = ["iss", "aud", "sub", "ref", "environment", "event_name", "repository", "repository_owner", "job_workflow_ref"]
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-gha-tf-apply
          role-session-name: tf-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # The saved plan is applied in the same job, so what runs is exactly what
      # was planned. It is never uploaded as an artifact (plans can contain secrets).
      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Plan summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Outputs
        run: |
          {
            echo '### Outputs'
            terraform output
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Platform layer: ArgoCD + root app-of-apps (needs the cluster from above) ----
      # Kept as a separate state so the Helm provider only configures once the
      # cluster exists. No PR plan for this stack: the read-only plan role has
      # no Kubernetes access by design (see ARCHITECTURE.md).
      - name: platform / terraform init
        working-directory: terraform/envs/prod-platform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: platform / terraform plan
        working-directory: terraform/envs/prod-platform
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: platform / plan summary
        working-directory: terraform/envs/prod-platform
        run: |
          {
            echo '### Terraform plan (platform)'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: platform / terraform apply
        working-directory: terraform/envs/prod-platform
        run: terraform apply -input=false -auto-approve tfplan
